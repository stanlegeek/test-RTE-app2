name: Keep-alive Streamlit

# Streamlit Community Cloud met une application en sommeil après plusieurs
# jours sans trafic. Le visiteur tombe alors sur l'écran "Yes, get this app
# back up!", particulièrement gênant quand l'app est intégrée en iframe dans
# le site declic-climatique.
#
# Toute la logique est dans scripts/reveil-streamlit.mjs, qui explique
# pourquoi un vrai navigateur est nécessaire là où un curl ne servait à rien.
# Ce fichier-ci n'est qu'un lanceur : il ne devrait plus avoir besoin de
# bouger, et le script se fait évoluer par un simple push.

on:
  schedule:
    # Tous les jours à 05:17 UTC (07:17 heure de Paris en été).
    # Minute décalée volontairement : les crons à l'heure pile sont saturés
    # chez GitHub et peuvent être retardés de plusieurs dizaines de minutes.
    - cron: "17 5 * * *"
  # Permet aussi de lancer le réveil à la main depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  reveil:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Playwright (Chromium)
        run: npm install --no-save playwright@1.49 && npx playwright install --with-deps chromium

      - name: Réveiller l'application et vérifier qu'elle répond
        run: node scripts/reveil-streamlit.mjs

      - name: Copie d'écran en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echec
          path: echec.png
          if-no-files-found: ignore

name: Keep-alive Streamlit

# Streamlit Community Cloud met une application en sommeil après plusieurs
# jours sans trafic. Le visiteur tombe alors sur l'écran « Yes, get this app
# back up! », particulièrement gênant quand l'app est intégrée en iframe dans
# le site declic-climatique.
#
# Ce workflow visite l'application une fois par jour pour remettre à zéro le
# compteur d'inactivité.

on:
  schedule:
    # Tous les jours à 05:17 UTC (07:17 heure de Paris en été).
    # Minute décalée volontairement : les crons à l'heure pile sont saturés
    # chez GitHub et peuvent être retardés de plusieurs dizaines de minutes.
    - cron: "17 5 * * *"
  # Permet aussi de lancer le ping à la main depuis l'onglet Actions.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visiter l'application Streamlit
        run: |
          # --cookie-jar / --cookie sont indispensables : sans eux, Streamlit
          # renvoie indéfiniment un 303 pour poser son cookie de session, curl
          # reboucle et s'arrête à sa 50e redirection (erreur 47).
          # --max-redirs borne la casse si le handshake change à nouveau.
          code=$(curl --silent --show-error --location \
                      --cookie-jar /tmp/cookies.txt --cookie /tmp/cookies.txt \
                      --max-redirs 10 \
                      --retry 3 --retry-delay 20 --max-time 120 \
                      --output /dev/null --write-out "%{http_code}" \
                      --user-agent "Mozilla/5.0 (X11; Linux x86_64) keep-alive-bot (github actions)" \
                      "https://test-rte-app2-yzbnnlgxqvqqq5kl34ufnr.streamlit.app" || echo "000")
          echo "Réponse HTTP : $code"
          case "$code" in
            2*|3*) echo "L'application a bien été sollicitée, le compteur d'inactivité est remis à zéro." ;;
            *) echo "::warning::Réponse inattendue ($code). Le trafic a tout de même été généré, mais l'app mérite un coup d'œil." ;;
          esac
